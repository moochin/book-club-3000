# Checks the example club file whenever it or the checker changes. The real
# file lives in a secret gist (see README); check it with
# python3 tools/check_bookclub.py <gist Raw link>.
name: Check bookclub.json
on:
  push:
    paths: [bookclub.example.json, tools/check_bookclub.py]
  pull_request:
    paths: [bookclub.example.json, tools/check_bookclub.py]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_bookclub.py bookclub.example.json
