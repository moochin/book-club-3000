# Runs the state-engine tests, builds the firmware (with the mascot art from
# art/mascot baked in) and renders UI previews. On a v* tag it also publishes
# the binaries as a GitHub Release, for over-the-air updates.
name: Firmware
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: [firmware/**, art/**, tools/*.py, .github/workflows/firmware.yml]
  pull_request:
    paths: [firmware/**, art/**, tools/*.py, .github/workflows/firmware.yml]
jobs:
  build:
    runs-on: ubuntu-latest
    # Publishing a release needs write access; the repo's default token is read-only.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: State engine tests
        run: pio test -e native
      - name: Build ILI9341 and ST7789 firmware
        run: pio run -e cyd -e cyd_st7789
      # Each build must fit an OTA app slot (app0 in partitions.csv). Warn from
      # 90% so there's time to slim the art or sounds; fail from 95%, before a
      # build too big to install over the air can reach a release.
      - name: Check the firmware fits its OTA slot
        run: |
          slot=$(( $(awk -F, '$1 ~ /^app0/ {gsub(/ /, "", $5); print $5}' partitions.csv) ))
          [ "$slot" -gt 0 ] || { echo "::error::couldn't read app0's size from partitions.csv"; exit 1; }
          rc=0
          for env in cyd cyd_st7789; do
            size=$(stat -c %s .pio/build/$env/firmware.bin)
            pct=$(( size * 100 / slot ))
            echo "$env: $size of $slot bytes ($pct%), $(( slot - size )) bytes free"
            if [ $(( size * 100 )) -gt $(( slot * 95 )) ]; then
              echo "::error::$env firmware is $pct% of its OTA slot (limit 95%). Slim the baked-in sounds or art, or drop CORE_DEBUG_LEVEL; see firmware/README.md."
              rc=1
            elif [ $(( size * 100 )) -gt $(( slot * 90 )) ]; then
              echo "::warning::$env firmware is $pct% of its OTA slot; the build fails at 95%."
            fi
          done
          exit $rc
      - name: Render UI and mascot previews
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
          ../art/preview.sh
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: |
            art/preview/*.png
            art/preview/sounds/*.wav
      - name: Check the tag matches BC_FW_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^#define BC_FW_VERSION "\(.*\)"/\1/p' src/config.h)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != BC_FW_VERSION $v"; exit 1; }
      - name: Collect binaries
        run: |
          mkdir -p ../dist
          cp .pio/build/cyd/firmware.bin ../dist/firmware.bin
          cp .pio/build/cyd_st7789/firmware.bin ../dist/firmware-st7789.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.bin
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
      # A release published from the wrong commit (before the version bump was
      # merged, or with a mistyped tag) gets no binaries. Say so on the release
      # page itself, where the owner is looking, instead of failing silently.
      - name: Explain on the release why it has no firmware
        if: failure() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^#define BC_FW_VERSION "\(.*\)"/\1/p' src/config.h)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            why="This tag (${GITHUB_REF_NAME}) is on a commit whose firmware version is ${v}: it was published before the version bump reached main, or the tag is mistyped."
          else
            why="The firmware build or its tests failed: see ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
          printf '%s\n\n%s\n\n%s\n' \
            "**No firmware attached, so don't point the club file at this release.**" \
            "$why" \
            "Delete this release. Once the version bump is merged to main, publish a release whose tag is exactly v<BC_FW_VERSION> from main." \
            > notes.md
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file notes.md
