; Book-Club 3000 firmware
; Build:   pio run -e cyd
; Flash:   pio run -e cyd -t upload
; OTA:     pio run -e cyd_ota -t upload --upload-port bookclub-<owner>.local
; Tests:   pio test -e native

[platformio]
default_envs = cyd

[env]
lib_deps_common =
    bblanchon/ArduinoJson @ ^7.2.1

[env:cyd]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
; Bakes ../art/mascot/*.png into src/art_data.h before each build.
extra_scripts = pre:scripts/art.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    ${env.lib_deps_common}
    lovyan03/LovyanGFX @ ^1.2.0
    tzapu/WiFiManager @ ^2.0.17
    madhephaestus/ESP32Encoder @ ^0.11.7
build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; Display panel: confirm at bring-up (see README "Bring-up").
    ; BC_PANEL_ILI9341 (original CYD) or BC_PANEL_ST7789 (many USB-C revisions)
    -DBC_PANEL_ILI9341
    ; Colour inversion: flip to 1 if colours look like a photo negative.
    -DBC_PANEL_INVERT=0
    ; Set to 1 for a bring-up build: test pattern + input/audio logging.
    -DBC_BRINGUP=0

; Same as cyd, but for the ST7789 USB-C boards.
[env:cyd_st7789]
extends = env:cyd
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DBC_PANEL_ST7789
    -DBC_PANEL_INVERT=0
    -DBC_BRINGUP=0

; Bring-up build: test pattern, encoder/button logging, backlight sweep, clicks.
[env:cyd_bringup]
extends = env:cyd
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBC_PANEL_ILI9341
    -DBC_PANEL_INVERT=0
    -DBC_BRINGUP=1

; Flash over the LAN with ArduinoOTA.
[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
; upload_flags = --auth=<the unit's OTA password, if set>

; Host-side unit tests for the pure state engine.
[env:native]
platform = native
test_framework = unity
lib_deps = ${env.lib_deps_common}
build_flags = -std=gnu++17 -Wall -Wextra
